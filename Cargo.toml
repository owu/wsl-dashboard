[package]
name = "wsldashboard"
# version: 0.10.0-alpha.1 , 0.10.0-beta.1 , 0.10.0-rc.1
version = "0.12.0-alpha.1"
edition = "2024"
rust-version = "1.92"
description = "A modern, high-performance, lightweight, and low-memory WSL (Windows Subsystem for Linux) instance management dashboard."
repository = "https://github.com/owu/wsl-dashboard"
homepage = "https://www.wslui.com"
documentation = "https://docs.wslui.com"
license = "GPL-3.0"

[package.metadata]
expire = 0

[[bin]]
name = "wsldashboard"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.0", features = ["backend-winit", "renderer-skia"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"
uuid = { version = "1.23.4", features = ["v4"] }
rfd = "0.17"
open = "5.3.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3.3", features = ["json", "native-tls"] }
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "0.3.32"
semver = "1.0.28"
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10"
dirs = "6.0"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Console", "UI_ViewManagement", "Foundation", "Win32_Devices_DeviceAndDriverInstallation"] }
rust-embed = "8.11.0"
once_cell = "1.21.4"
tray-icon = "0.24"
scopeguard = "1.2.0"
rust-ini = "0.21.3"
dhat = { version = "0.3.3", optional = true }
get_if_addrs = "0.5.3"
urlencoding = "2.1.3"
async-trait = "0.1.89"
native-tls = "0.2.18"
md5 = "0.8.1"

[features]
dhat-heap = ["dhat"]

[build-dependencies]
slint-build = "1.18.0"
embed-resource = "3.0.11"
image = "0.25.10"
toml = "1.1"
ico = "0.5.0"

[dev-dependencies]
tempfile = "3"
serde_test = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
